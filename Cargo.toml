[package]
name = "vier"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Four in a row against the computer or a second player"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/vier-desktop"
publish = false

[dependencies]
eframe = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
section = "games"
priority = "optional"
depends = "$auto, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libegl1, libvulkan1 | libgl1, libx11-6, libx11-xcb1, libxi6, libxcursor1, libxrandr2, desktop-file-utils, hicolor-icon-theme"
extended-description = """\
Vier is four in a row on a seven-by-six board. Play red against the computer \
at Easy, Medium or Hard, or pass the mouse between two players. It makes no \
network connection and keeps only its settings and the game in progress."""
assets = [
    ["target/release/vier", "usr/bin/", "755"],
    ["packaging/linux/vier.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/vier.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
